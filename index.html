<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>汽车品牌销售大区经营诊断数据仪表盘</title>
<style>
:root {
  --bg-primary: #f5f6f8; --bg-secondary: #fff; --bg-card: #fff;
  --bg-sidebar: #1a1f36; --border: #e2e5ea; --border-light: #eef0f4;
  --text-primary: #1a1f36; --text-secondary: #5a6170; --text-muted: #9199a8;
  --accent: #3b6df0; --accent-hover: #2b54d4; --accent-light: #eef3ff;
  --green: #16a34a; --green-bg: #f0fdf4; --green-border: #bbf7d0;
  --yellow: #ca8a04; --yellow-bg: #fefce8; --yellow-border: #fef08a;
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --sidebar-width: 270px; --topbar-height: 56px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg-primary);color:var(--text-primary);display:flex;height:100vh;overflow:hidden;}

.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-sidebar);display:flex;flex-direction:column;z-index:10;color:#c8cdd8;}
.sidebar-header{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-header .logo{font-size:12px;font-weight:700;color:#6b8cff;letter-spacing:1px;text-transform:uppercase;}
.sidebar-header .title{font-size:13px;color:#8b92a5;margin-top:4px;line-height:1.5;}
.version-badge{display:inline-block;margin-top:8px;padding:2px 8px;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6b8cff,#4a6cf7);border-radius:4px;letter-spacing:0.5px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-group{margin-bottom:2px;}
.nav-group-header{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:#a8b0c0;font-size:13px;font-weight:500;transition:all 0.15s;user-select:none;}
.nav-group-header:hover{background:rgba(107,140,255,0.12);color:#d0d5e0;}
.nav-group-header.active{background:rgba(107,140,255,0.18);color:#fff;border-right:3px solid #6b8cff;}
.nav-group-header .icon{width:18px;text-align:center;font-size:13px;}
.nav-group-header .arrow{margin-left:auto;font-size:9px;transition:transform 0.2s;opacity:0.5;}
.nav-group-header.expanded .arrow{transform:rotate(90deg);}
.nav-sub{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.nav-sub.open{max-height:800px;overflow-y:auto;}
.nav-sub-item{display:flex;align-items:center;gap:8px;padding:7px 18px 7px 46px;cursor:pointer;font-size:13px;color:#8b92a5;transition:all 0.15s;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-sub-item:hover{background:rgba(107,140,255,0.08);color:#c0c8d8;}
.nav-sub-item.active{background:rgba(107,140,255,0.12);color:#fff;}
.nav-sub-item .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.nav-sub-item .dot.green{background:#4ade80;}.nav-sub-item .dot.yellow{background:#facc15;}.nav-sub-item .dot.red{background:#f87171;}
.nav-sub-item .badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,0.08);color:#8b92a5;}
.sidebar-footer{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.08);font-size:12px;color:#5a6070;display:flex;justify-content:space-between;}
/* Dealer sidebar */
.nav-dealer-region{display:flex;align-items:center;gap:8px;padding:7px 18px 7px 36px;cursor:pointer;font-size:13px;color:#8b92a5;transition:all 0.15s;user-select:none;}
.nav-dealer-region:hover{background:rgba(107,140,255,0.08);color:#c0c8d8;}
.nav-dealer-region.active{background:rgba(107,140,255,0.15);color:#fff;font-weight:600;}
.nav-dealer-region .badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(255,255,255,0.08);color:#8b92a5;}
.nav-dealer-subs{max-height:0;overflow:hidden;transition:max-height 0.3s ease;}
.nav-dealer-subs.open{max-height:800px;overflow-y:auto;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:var(--topbar-height);min-height:var(--topbar-height);background:var(--bg-secondary);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
.breadcrumb{font-size:12px;color:var(--text-muted);}.breadcrumb span{color:var(--text-secondary);}.breadcrumb .sep{margin:0 6px;}.breadcrumb .current{color:var(--text-primary);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.month-badge{background:var(--bg-primary);border:1px solid var(--border);padding:5px 12px;border-radius:6px;font-size:11px;color:var(--text-muted);}
.role-selector select{appearance:none;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-primary);padding:7px 32px 7px 14px;border-radius:6px;font-size:12px;cursor:pointer;outline:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23919aa8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;}
.role-selector select:hover{border-color:var(--accent);}
.content{flex:1;overflow-y:auto;padding:20px 24px;}
.page{display:none;}.page.active{display:block;animation:fadeIn 0.25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.summary-bar{display:flex;gap:14px;margin-bottom:20px;}
.summary-item{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);}
.summary-item .count{font-size:28px;font-weight:700;line-height:1;}.summary-item .count.red{color:var(--red);}.summary-item .count.yellow{color:var(--yellow);}.summary-item .count.green{color:var(--green);}.summary-item .label{font-size:12px;color:var(--text-muted);}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.kpi-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.kpi-card .status-bar{position:absolute;top:0;left:0;right:0;height:3px;}
.kpi-card .status-bar.green{background:var(--green);}.kpi-card .status-bar.yellow{background:var(--yellow);}.kpi-card .status-bar.red{background:var(--red);}
.kpi-card .kpi-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;margin-top:4px;}
.kpi-card .kpi-name{font-size:13px;font-weight:600;color:var(--text-primary);line-height:1.4;}
.kpi-card .kpi-badge{padding:2px 10px;border-radius:10px;font-size:10px;font-weight:600;flex-shrink:0;}
.kpi-card .kpi-badge.green{background:var(--green-bg);color:var(--green);}.kpi-card .kpi-badge.yellow{background:var(--yellow-bg);color:var(--yellow);}.kpi-card .kpi-badge.red{background:var(--red-bg);color:var(--red);}
.kpi-card .kpi-values{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.kpi-card .kpi-current{font-size:26px;font-weight:700;}.kpi-card .kpi-current.green{color:var(--green);}.kpi-card .kpi-current.yellow{color:var(--yellow);}.kpi-card .kpi-current.red{color:var(--red);}
.kpi-card .kpi-target{font-size:11px;color:var(--text-muted);}
.kpi-card .kpi-footer{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--text-muted);}
.kpi-card .kpi-role{color:var(--accent);cursor:pointer;}.kpi-card .kpi-role:hover{text-decoration:underline;}

.section-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px;}
.section-title .dot-icon{width:8px;height:8px;border-radius:50%;}.section-title .dot-icon.red{background:var(--red);}.section-title .dot-icon.yellow{background:var(--yellow);}.section-title .dot-icon.green{background:var(--green);}

.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px;background:var(--bg-card);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
.data-table th{background:#f8f9fb;padding:10px 14px;text-align:left;color:var(--text-muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border);}
.data-table td{padding:9px 14px;border-bottom:1px solid var(--border-light);color:var(--text-secondary);}
.data-table tr:last-child td{border-bottom:none;}.data-table tr:hover td{background:#f8f9fb;}
.drillable-row{cursor:pointer;}.drillable-row:hover td{background:#e8f0fe;}.drillable-row td:last-child::after{content:' ▸';color:var(--accent);font-weight:700;}
.no-drill{cursor:default;}
.task-link{color:var(--accent);cursor:pointer;font-weight:500;}.task-link:hover{text-decoration:underline;}
.status-pill{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:600;}
.status-pill.green{background:var(--green-bg);color:var(--green);}.status-pill.yellow{background:var(--yellow-bg);color:var(--yellow);}.status-pill.red{background:var(--red-bg);color:var(--red);}

.drilldown-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:100;justify-content:center;align-items:center;}
.drilldown-overlay.open{display:flex;}
.drilldown-panel{background:var(--bg-card);border-radius:14px;width:92%;max-width:960px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15);padding:28px;}
.drilldown-panel .panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border-light);}
.drilldown-panel .panel-title{font-size:16px;font-weight:700;}
.drilldown-panel .panel-task-link{font-size:12px;font-weight:500;color:var(--accent);cursor:pointer;margin-left:8px;padding:2px 10px;border:1px solid var(--accent);border-radius:4px;transition:all .2s;white-space:nowrap;}
.drilldown-panel .panel-task-link:hover{background:var(--accent);color:#fff;}
.drilldown-panel .panel-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);padding:4px 8px;border-radius:4px;}
.drilldown-panel .panel-close:hover{background:var(--bg-primary);color:var(--text-primary);}
.panel-stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.panel-stat{flex:1;min-width:100px;background:var(--bg-primary);border-radius:8px;padding:14px;text-align:center;}
.panel-stat .stat-value{font-size:22px;font-weight:700;}
.panel-stat .stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;}
.panel-stat .stat-value.red{color:var(--red);}.panel-stat .stat-value.yellow{color:var(--yellow);}.panel-stat .stat-value.green{color:var(--green);}

.insight-box{background:var(--accent-light);border:1px solid #c7d5ff;border-radius:8px;padding:14px 18px;margin-bottom:18px;font-size:12px;color:var(--accent-hover);line-height:1.7;}
.insight-box.warn{background:var(--red-bg);border-color:var(--red-border);color:var(--red);}
.insight-box .insight-title{font-weight:700;margin-bottom:4px;font-size:13px;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.bar-row .bar-label{width:100px;font-size:11px;text-align:right;color:var(--text-muted);flex-shrink:0;}
.bar-row .bar-track{flex:1;height:20px;background:var(--bg-primary);border-radius:4px;overflow:hidden;position:relative;}
.bar-row .bar-fill{height:100%;border-radius:4px;transition:width 0.4s;}
.bar-row .bar-fill.red{background:var(--red);}.bar-row .bar-fill.yellow{background:var(--yellow);}.bar-row .bar-fill.green{background:var(--green);}
.bar-row .bar-val{width:50px;font-size:11px;font-weight:600;flex-shrink:0;}

.task-list{display:flex;flex-direction:column;gap:8px;}
.task-item{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow);}
.task-item:hover{border-color:var(--accent);}
.task-item .task-id{font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;min-width:48px;text-align:center;}
.task-item .task-id.p1{background:var(--red-bg);color:var(--red);}.task-item .task-id.p2{background:var(--yellow-bg);color:var(--yellow);}.task-item .task-id.p3{background:var(--green-bg);color:var(--green);}
.task-item .task-info{flex:1;}.task-item .task-name{font-size:13px;font-weight:500;}.task-item .task-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}.task-item .task-role{font-size:11px;color:var(--accent);}

.task-filter-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;transition:all 0.15s;}
.task-filter-btn:hover{border-color:var(--accent);}.task-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.task-filter-bar{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;}
.filter-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.filter-label{font-size:12px;color:var(--text-secondary);font-weight:600;min-width:72px;}
.task-chip{background:var(--bg-page);border:1px solid var(--border);color:var(--text-secondary);padding:4px 12px;border-radius:14px;cursor:pointer;font-size:12px;transition:all 0.15s;white-space:nowrap;}
.task-chip:hover{border-color:var(--accent);color:var(--accent);}
.task-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.filter-summary{font-size:11px;color:var(--text-secondary);text-align:right;border-top:1px solid var(--border);padding-top:6px;}
.task-remind-btn{background:var(--accent);color:#fff;border:none;padding:4px 12px;border-radius:12px;font-size:11px;cursor:pointer;transition:all 0.15s;margin-left:8px;white-space:nowrap;}
.task-remind-btn:hover{background:#2563eb;transform:scale(1.05);}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;pointer-events:none;transition:opacity 0.3s;box-shadow:0 4px 16px rgba(16,185,129,0.35);}
.toast.show{opacity:1;}
.region-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:18px;}
.region-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow);}
.region-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.region-card .rc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.region-card .rc-name{font-size:13px;font-weight:700;}
.region-card .rc-status{font-size:11px;font-weight:600;padding:3px 12px;border-radius:12px;}
.region-card .rc-status.red{background:var(--red-bg);color:var(--red);}.region-card .rc-status.yellow{background:var(--yellow-bg);color:var(--yellow);}.region-card .rc-status.green{background:var(--green-bg);color:var(--green);}
.region-card .rc-stats{display:flex;gap:16px;margin-bottom:14px;}
.region-card .rc-stat{text-align:center;flex:1;}
.region-card .rc-stat .rcs-val{font-size:14px;font-weight:700;line-height:1.1;}
.region-card .rc-stat .rcs-val.red{color:var(--red);}.region-card .rc-stat .rcs-val.yellow{color:var(--yellow);}.region-card .rc-stat .rcs-val.green{color:var(--green);}
.region-card .rc-stat .rcs-lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}
.region-card .rc-dealers{display:flex;flex-wrap:wrap;gap:6px;}
.region-card .rc-dealer-tag{font-size:11px;padding:4px 10px;border-radius:10px;background:var(--bg-primary);color:var(--text-secondary);border:1px solid var(--border-light);}
.region-card .rc-dealer-tag.red{background:var(--red-bg);color:var(--red);border-color:var(--red-border);}
.region-card .rc-dealer-tag.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);}

.dealer-detail-header{display:flex;align-items:center;justify-content:space-between;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.dealer-detail-header .ddh-left{display:flex;align-items:center;gap:12px;}
.dealer-detail-header .ddh-city{font-size:18px;font-weight:700;}
.dealer-detail-header .ddh-meta{font-size:11px;color:var(--text-muted);}
.dealer-detail-header .ddh-right{display:flex;gap:20px;}
.dealer-detail-header .ddh-stat{text-align:center;}
.dealer-detail-header .ddh-stat .dds-val{font-size:18px;font-weight:700;}
.dealer-detail-header .ddh-stat .dds-lbl{font-size:10px;color:var(--text-muted);}

.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);cursor:pointer;margin-top:14px;}.back-link:hover{text-decoration:underline;}
.task-status{display:inline-flex;align-items:center;gap:4px;font-size:0.75rem;font-weight:500;padding:2px 8px;border-radius:10px;white-space:nowrap}.task-status.s-未开始{background:#e9ecef;color:#6c757d}.task-status.s-进行中{background:#e7f1ff;color:#0d6efd}.task-status.s-已验证{background:#d1fae5;color:#059669}.task-status.s-已关闭{background:#f3f4f6;color:#9ca3af}.task-status.s-已取消{background:#fee2e2;color:#dc2626}

/* === Region Page Styles === */
.region-hero{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1e3a3a 0%,#2d5e5e 100%);border-radius:12px;padding:22px 28px;margin-bottom:18px;color:#fff;}
.region-hero.warn{background:linear-gradient(135deg,#4a3a1e 0%,#6e5a2d 100%);}
.region-hero.danger{background:linear-gradient(135deg,#4a1e2a 0%,#6e2d3a 100%);}
.region-hero .rh-left{display:flex;align-items:center;gap:14px;}
.region-hero .rh-icon{width:48px;height:48px;background:rgba(255,255,255,0.12);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;}
.region-hero .rh-name{font-size:13px;font-weight:800;letter-spacing:-0.5px;}
.region-hero .rh-meta{font-size:11px;opacity:0.6;margin-top:3px;display:flex;gap:16px;}
.region-hero .rh-right{display:flex;align-items:center;gap:16px;}
.region-hero .rh-stat{text-align:center;padding:0 12px;}
.region-hero .rhs-val{font-size:14px;font-weight:700;line-height:1.2;}
.region-hero .rhs-val.red{color:#fca5a5;}.region-hero .rhs-val.yellow{color:#fde047;}.region-hero .rhs-val.green{color:#86efac;}
.region-hero .rhs-lbl{font-size:10px;opacity:0.5;margin-top:2px;}
.region-hero .rh-status{display:flex;align-items:center;gap:5px;padding:6px 16px;border-radius:20px;font-size:12px;font-weight:600;}
.region-hero .rh-status.red{background:rgba(220,38,38,0.18);color:#fca5a5;}.region-hero .rh-status.yellow{background:rgba(202,138,4,0.18);color:#fde047;}.region-hero .rh-status.green{background:rgba(22,163,74,0.18);color:#86efac;}

.rh-metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.rh-metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);transition:all 0.15s;}
.rh-metric-card:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);}
.rh-metric-card .rmc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.rh-metric-card .rmc-icon.blue{background:var(--accent-light);}
.rh-metric-card .rmc-icon.green{background:var(--green-bg);}
.rh-metric-card .rmc-icon.yellow{background:var(--yellow-bg);}
.rh-metric-card .rmc-icon.red{background:var(--red-bg);}
.rh-metric-card .rmc-body{flex:1;min-width:0;}
.rh-metric-card .rmc-val{font-size:13px;font-weight:700;line-height:1.1;}

  }
  panel.innerHTML=html;
  primaryDrillContext={type,name};
  const drillableTypes=['salesRate','profitHealth','unitProfit','stockDepth','nps','conversion','turnover'];
  panel.querySelectorAll('.data-table tbody tr').forEach(tr=>{
    const td=tr.querySelector('td');if(!td)return;
    if(drillableTypes.includes(type)){

      tr.onclick=function(e){e.stopPropagation();secondaryDrilldown(type,td.textContent.trim(),td.textContent.trim());};
    }else{
      tr.classList.add('no-drill');
    }
  });
  document.getElementById('drilldownOverlay').classList.add('open');
}

function drilldownHeader(name,s,taskId){return `<div class="panel-header"><span class="panel-title">${name} — 下钻明细${taskId?`<span class="panel-task-link" onclick="event.stopPropagation();jumpToTask('${taskId}')">检核任务 ${taskId} →</span>`:''}</span><button class="panel-close" onclick="closeDrilldown()">✕</button></div><div class="panel-stats"><div class="panel-stat"><div class="stat-value ${s.status}">${s.current}</div><div class="stat-label">当前值</div></div><div class="panel-stat"><div class="stat-value">${s.target}</div><div class="stat-label">目标值</div></div><div class="panel-stat"><div class="stat-value ${s.status}">${s.gap}</div><div class="stat-label">风险差距</div></div></div>`;}
function insightBox(text,cls){return `<div class="insight-box${cls?' '+cls:''}"><div class="insight-title">分析洞察</div>${text}</div>`;}

let taskFilters={priority:'all',status:'all',role:'all'};
function renderTasks(filter){
  if(typeof filter==='string')taskFilters={priority:filter==='all'?'all':filter,status:'all',role:'all'};
  else if(filter)taskFilters={...taskFilters,...filter};
  const f=taskFilters;let tasks=taskData;
  if(f.priority!=='all')tasks=tasks.filter(t=>t.priority===f.priority);
  if(f.status!=='all')tasks=tasks.filter(t=>t.status===f.status);
  if(f.role!=='all')tasks=tasks.filter(t=>t.role===f.role);if(currentRole)tasks=tasks.filter(t=>t.role===currentRole);
    const statuses=['未开始','进行中','已验证','已关闭','已取消'],roles=['大区总','大区副总','市场经理','新媒体经理','零售经理','培训经理','渠道交付经理','运营支持'];

  document.getElementById('page-tasks').innerHTML=filterBar+`<div class="task-list">${tasks.map(t=>`<div class="task-item" onclick="handleTaskClick('${t.id}')"><span class="task-id ${t.priority.toLowerCase()}">${t.id}</span><div class="task-info"><div class="task-name">${t.name}</div><div class="task-meta">关联KPI: ${t.kpi} · 优先级: ${t.priority}</div></div><span class="task-role">${t.role}</span><span class="task-status s-${t.status}">${t.status}</span><button class="task-remind-btn" onclick="sendReminder(event,'${t.role}')">提醒</button></div>`).join('')}</div>${currentRole?`<div class="back-link" onclick="switchRolePage('${currentRole}')">← 返回岗位看板</div>`:`<div class="back-link" onclick="switchPage('dashboard')">← 返回大区总驾驶舱</div>`}`;

function setTaskFilter(key,value){taskFilters[key]=value;renderTasks();}

var list=[];
for(var i=0;i<dealerList.length;i++){var name=dealerList[i].name;var kd=dealerKPIData[name];if(!kd)continue;var raw=kd[cfg.key];if(raw===undefined)continue;var val=cfg.fmt(raw);var status=cfg.getStatus(raw);list.push({name:name,val:val,status:status});}
if(cfg.dir==='asc')list.sort(function(a,b){return parseFloat(a.val)-parseFloat(b.val);});
else if(cfg.dir==='desc')list.sort(function(a,b){return parseFloat(b.val)-parseFloat(a.val);});

if(cfg.target==='目标分散'){for(var i=0;i<rows.length;i++){rows[i][2]='#'+(i+1);}}

// ==================== NAVIGATION ====================
function switchTaskLevel(level){
  hideAllPages();
  document.getElementById('page-tasks').classList.add('active');
  const labels={P1:'P1 紧急',P2:'P2 重要',P3:'P3 常规'};
  updateBreadcrumb('检核任务中心 — '+labels[level]);
  updateSidebarActive('tasks-'+level);
  renderTasks({priority:level,status:'all',role:'all'});
}
function switchPage(page){if(currentRole&&page!=='dashboard'&&page!=='tasks'){switchRolePage(currentRole);showToast('权限不足，仅可查看当前岗位数据');return;}const map={dashboard:'大区总驾驶舱',tasks:'检核任务中心',dealer:'经销商片区总览'};hideAllPages();let el=document.getElementById('page-'+page);if(el)el.classList.add('active');updateSidebarActive(page);if(page.startsWith('vehicle-')){const type=page.replace('vehicle-','');updateBreadcrumb('车型看板 — '+type+' 型');renderVehiclePage(type);}else if(page==='dealer'){document.getElementById('page-dealer-dashboard').classList.add('active');updateBreadcrumb('经销商片区总览');renderDealerDashboard();}else if(page==='dealer-generic'){updateBreadcrumb('经销商看板');}else{updateBreadcrumb(map[page]||page);if(page==='dashboard')renderDashboard();if(page==='tasks')renderTasks('all');}}

function switchRolePage(role){if(currentRole&&role!==currentRole){switchRolePage(currentRole);showToast('权限不足，仅可查看当前岗位数据');return;}hideAllPages();document.getElementById('page-role').classList.add('active');document.getElementById('roleSelect').value=role;updateBreadcrumb(role+'看板');renderRolePage(role);updateSidebarActive('role',role);}
function switchDealerRegion(region){if(currentRole){switchRolePage(currentRole);showToast('权限不足，仅可查看当前岗位数据');return;}hideAllPages();document.getElementById('page-dealer-region').classList.add('active');updateBreadcrumb('经销商看板 — '+region+'片区');document.querySelectorAll('.nav-dealer-subs').forEach(s=>s.classList.remove('open'));const sub=document.getElementById('sub-dealer-'+region);if(sub)sub.classList.add('open');renderDealerRegion(region);}


function switchDealerPage(dealerId){if(currentRole){switchRolePage(currentRole);showToast('权限不足，仅可查看当前岗位数据');return;}hideAllPages();document.getElementById('page-dealer-generic').classList.add('active');const d=dealerList.find(x=>x.id===dealerId);const name=d?d.name:dealerId;updateBreadcrumb('经销商看板 — '+name);renderDealerPage(dealerId);updateSidebarActive('dealer',dealerId);}

function toggleDealerSubs(region){const sub=document.getElementById('sub-dealer-'+region);if(sub){sub.classList.toggle('open');}}

let currentRole=null;function onRoleSelectChange(){const role=document.getElementById('roleSelect').value;if(!role)return;if(role==='大区总'){currentRole=null;updateSidebarForRole();switchPage('dashboard');return;}currentRole=role;updateSidebarForRole();switchRolePage(role);}
function updateSidebarForRole(){const groups=['complete','vehicle','dealer','roles'];groups.forEach(g=>{const el=document.querySelector(`[data-nav="${g}"]`);if(el&&el.parentElement)el.parentElement.style.display=currentRole?'none':'';});const rd=document.getElementById('nav-role-dashboard');if(currentRole){if(rd)rd.style.display='';expandGroup('sub-role-dashboard');const si=document.querySelector('#sub-role-dashboard .nav-sub-item');if(si)si.classList.add('active');}else{if(rd)rd.style.display='none';}}function hideAllPages(){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));}
function updateBreadcrumb(text){document.getElementById('breadcrumb').innerHTML=`<span>大区经营诊断</span><span class="sep">/</span><span class="current">${text}</span>`;}

function updateSidebarActive(page,extra){
  document.querySelectorAll('.nav-group-header,.nav-sub-item,.nav-dealer-region').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-sub').forEach(s=>s.classList.remove('open'));
  document.querySelectorAll('.nav-group-header').forEach(h=>h.classList.remove('expanded'));
  if(page==='dashboard'){
    const el=document.querySelector('.nav-sub-item[data-nav="dashboard"]');if(el)el.classList.add('active');
    expandGroup('sub-complete');
  }else if(page==='tasks'){
    const el=document.querySelector('.nav-sub-item[data-nav="tasks"]');if(el)el.classList.add('active');
    expandGroup('sub-inspection');
  }else if(page==='tasks-P1'||page==='tasks-P2'||page==='tasks-P3'){
    const el=document.querySelector(`.nav-sub-item[data-nav="tasks-${page.split('-')[1]}"]`);if(el)el.classList.add('active');
    expandGroup('sub-inspection');
  }else if(page==='role'){
    expandGroup('sub-role-dashboard');
    const rd=document.querySelector('.nav-group-header[data-nav="role-dashboard"]');
    if(rd)rd.classList.add('active');
  }else if(page.startsWith('vehicle-')){
    const vt=page.replace('vehicle-','');const el=document.querySelector(`.nav-sub-item[data-nav="vehicle-${vt}"]`);if(el)el.classList.add('active');
    expandGroup('sub-vehicle');
  }else if(page==='dealer'){
    const header=document.querySelector('.nav-group-header[data-nav="dealer"]');if(header)header.classList.add('active');
    if(extra){
      if(dealerList.find(d=>d.id===extra)){
        const el=document.querySelector(`.nav-sub-item[data-nav="dealer-${extra}"]`);if(el)el.classList.add('active');
      }else{
        const rel=document.querySelector(`.nav-dealer-region[data-nav="region-${extra}"]`);if(rel)rel.classList.add('active');
      }
    }
    expandGroup('sub-dealer');
  }else if(page==='dealer-generic'){
    const el=document.querySelector(`.nav-sub-item[data-nav="dealer-${extra}"]`);if(el)el.classList.add('active');
    expandGroup('sub-dealer');
  }
}

function expandGroup(subId){
  const sub=document.getElementById(subId);if(sub){sub.classList.add('open');}
  const header=document.querySelector(`.nav-group-header[data-nav="${subId.replace('sub-','')}"]`);if(header){header.classList.add('expanded','active');}
}

function toggleNavGroup(header,subId){
  const wasExpanded=header.classList.contains('expanded');
  document.querySelectorAll('.nav-group-header').forEach(h=>h.classList.remove('expanded'));
  document.querySelectorAll('.nav-sub').forEach(s=>s.classList.remove('open'));
  if(!wasExpanded){
    header.classList.add('expanded');
    const sub=document.getElementById(subId);
    if(sub)sub.classList.add('open');
  }
}
